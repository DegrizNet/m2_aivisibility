name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    defaults:
      run:
        working-directory: dev/ci

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, bcmath, sodium, soap, zip, mbstring, iconv, gd
          coverage: none
          tools: composer:v2

      - name: Install the test harness from the Mage-OS mirror
        run: |
          # Magento 2.4.8 does not declare PHP 8.5 yet; the module itself does.
          EXTRA=""
          if [ "${{ matrix.php }}" = "8.5" ]; then EXTRA="--ignore-platform-req=php"; fi
          composer update --no-interaction --no-progress --prefer-dist $EXTRA

      - name: Lint
        working-directory: .
        run: |
          find . -path ./dev/ci/vendor -prune -o \( -name '*.php' -o -name '*.phtml' \) -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Validate the bundled JSON
        working-directory: .
        run: |
          for file in etc/db_schema_whitelist.json composer.json; do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"
          done

      - name: Unit tests
        run: vendor/bin/phpunit

      - name: Magento Coding Standard (errors)
        run: vendor/bin/phpcs -q --standard=Magento2 -n --extensions=php,phtml --ignore='*/dev/*' ../..
